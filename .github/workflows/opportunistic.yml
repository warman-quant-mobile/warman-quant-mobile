name: Warman Opportunistic 10R Watch
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC; 16:23 UTC = 17:23 CET / 18:23 CEST.
    - cron: '23 16 * * 1-5'
permissions:
  contents: write
concurrency:
  group: opportunistic-signal
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Offline scanner tests
        run: python -m unittest discover -s tests -v
      - name: Fetch new public research data
        run: python collector.py
      - name: Validate data; fail closed
        run: python validate.py output
      - name: Scan for rare 10R research candidates
        run: python opportunistic_scan.py --folder output --result signals/latest.json
      - name: Exploratory 10R historical event study
        run: python opportunistic_research.py --folder output --result signals/research_lab.json
      - name: Crash and reversal research diagnostics
        run: python contrarian_research.py --folder output --result signals/contrarian_lab.json
      - name: Detect extreme gaps and shock days (research only)
        run: python extreme_event_research.py --folder output --result signals/extreme_events.json
      - name: Evaluate extreme-event historical 10R outcomes
        run: python extreme_event_study.py --folder output --result signals/extreme_event_study.json
      - name: Published strategy research
        run: python published_strategy_lab.py --folder output --result signals/published_strategy_lab.json
      - name: Publish latest scan status for notification watcher
        run: |
          git config user.name "warman-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/latest.json signals/research_lab.json signals/contrarian_lab.json signals/extreme_events.json signals/extreme_event_study.json signals/published_strategy_lab.json
          if ! git diff --cached --quiet; then
            git commit -m "Update opportunistic research scan"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunistic-scan
          path: |
            signals/latest.json
            signals/research_lab.json
            signals/contrarian_lab.json
            signals/extreme_events.json
            signals/extreme_event_study.json
            signals/published_strategy_lab.json
            output/manifest.json
            output/quality.json
          retention-days: 30
