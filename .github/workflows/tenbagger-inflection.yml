name: Warman Tenbagger Inflection
on:\n  workflow_dispatch:\n  push:\n    paths: ['tenbagger_inflection_v1.py','.github/workflows/tenbagger-inflection.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: stock-picker-research
          run-id: 36842701260
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - run: mkdir -p signals && python tenbagger_inflection_v1.py --pit output/sec_point_in_time_broad.json --out signals/tenbagger_inflection_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: tenbagger-inflection
          path: signals/tenbagger_inflection_v1.json
