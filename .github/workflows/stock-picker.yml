name: Warman Stock Picker Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.stock-picker-trigger'
      - 'stock_picker_price_v1.py'
      - 'sec_fundamentals_collector.py'
      - 'stock_picker_universe.py'
      - 'research_safety.py'
      - '.github/workflows/stock-picker.yml'
permissions:
  contents: write
jobs:
  stock-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch research data
        run: python collector.py
      - name: Validate data fail closed
        run: python validate.py output
      - name: Build broad US equity universe
        run: python stock_picker_universe.py --out output/us_universe_current.json
      - name: Validate broad universe
        run: |
          python - <<'PY'
          import json
          d=json.load(open('output/us_universe_current.json'))
          assert d['count'] >= 3000, f"universe unexpectedly small: {d['count']}"
          print('US universe',d['count'])
          PY
      - name: Fetch point-in-time SEC fundamentals
        continue-on-error: true
        run: python sec_fundamentals_collector.py --ciks 320193,789019,1045810,1018724,1326801,1318605 --out output/sec_point_in_time.json
      - name: SEC PIT status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('output/sec_point_in_time.json')
          if p.exists() and p.stat().st_size > 1000:
              d=json.loads(p.read_text())
              print('SEC PIT available',p.stat().st_size,len(d.get('companies',{})))
          else:
              print('SEC PIT unavailable; broad Yahoo prototype continues')
          PY
      - name: Frozen Stock Picker price baseline
        run: python stock_picker_price_v1.py --folder output --result signals/stock_picker_price_v1.json
      - name: Publish research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/stock_picker_price_v1.json output/manifest.json output/sec_point_in_time.json output/us_universe_current.json output/*.csv || true
          git diff --cached --quiet || git commit -m "Update Stock Picker research output"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: stock-picker-research
          path: |
            signals/stock_picker_price_v1.json
            output/sec_point_in_time.json
            output/us_universe_current.json
