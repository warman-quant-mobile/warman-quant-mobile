name: Warman Stock Picker Lab
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
jobs:
  stock-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch research data
        run: python collector.py
      - name: Validate data fail closed
        run: python validate.py output
      - name: Build broad US and Swedish equity universes
        run: |
          python stock_picker_universe.py --region us --out output/us_universe_current.json
          python stock_picker_universe.py --region se --out output/se_universe_current.json
      - name: Validate broad universe
        run: |
          python - <<'PY'
          import json
          d=json.load(open('output/us_universe_current.json'))
          assert d['count'] >= 3000, f"universe unexpectedly small: {d['count']}"
          print('US universe',d['count'])
          s=json.load(open('output/se_universe_current.json'))
          assert s['count'] >= 100, f"Swedish universe unexpectedly small: {s['count']}"
          print('Swedish universe',s['count'])
          PY
      - name: Broad Stock Picker ranking
        run: python stock_picker_rank_v2.py
      - name: Winner Funnel current challenger
        run: python winner_funnel_v1.py
      - name: Fetch point-in-time SEC fundamentals
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          rm -f output/sec_point_in_time.json
          python sec_fundamentals_collector.py --ciks 320193,789019,1045810,1018724,1326801,1318605 --out output/sec_point_in_time.json
      - name: SEC PIT status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('output/sec_point_in_time.json')
          if p.exists() and p.stat().st_size > 1000:
              d=json.loads(p.read_text())
              print('SEC PIT available',p.stat().st_size,len(d.get('companies',{})))
          else:
              print('SEC PIT unavailable; broad Yahoo prototype continues')
          PY
      - name: Build broader SEC PIT diagnostic cohort
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_pit_broad_cohort.py --universe output/us_universe_current.json --limit 7500 --out output/sec_point_in_time_broad.json
      - name: Tenbagger historical PIT pilot
        if: hashFiles('output/sec_point_in_time.json') != ''
        run: python tenbagger_pit_pilot_v1.py --pit output/sec_point_in_time.json --out signals/tenbagger_pit_pilot_v1.json
      - name: Frozen Stock Picker price baseline
        run: python stock_picker_price_v1.py --folder output --result signals/stock_picker_price_v1.json
      - name: Publish research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/stock_picker_price_v1.json signals/stock_picker_prototype_v2.json signals/winner_funnel_v1.json signals/tenbagger_pit_pilot_v1.json output/sec_point_in_time.json output/sec_point_in_time_broad.json output/us_universe_current.json output/se_universe_current.json || true
          git diff --cached --quiet || git commit -m "Update Stock Picker research output"
          git fetch origin main
          git push origin HEAD:main || echo 'Research outputs retained in artifact; concurrent publish skipped'
      - uses: actions/upload-artifact@v4
        with:
          name: stock-picker-research
          path: |
            signals/stock_picker_price_v1.json
            signals/stock_picker_prototype_v1.json
            signals/stock_picker_prototype_v2.json
            signals/winner_funnel_v1.json
            signals/tenbagger_pit_pilot_v1.json
            output/sec_point_in_time.json
            output/sec_point_in_time_broad.json
            output/us_universe_current.json
            output/se_universe_current.json
