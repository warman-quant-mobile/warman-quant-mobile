name: Warman Frozen QGM Current Rank
on:
  push:
    branches: [main]
    paths:
      - 'stock_picker_frozen_qgm_current_v1.py'
      - '.github/workflows/stock-picker-frozen-current.yml'
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python stock_picker_frozen_qgm_current_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-picker-frozen-current
          path: signals/stock_picker_frozen_qgm_current_v1.json
