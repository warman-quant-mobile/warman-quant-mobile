name: Warman Stock Picker Final Holdout
on:
  push:
    branches: [main]
    paths:
      - 'stock_picker_final_holdout_v1.py'
permissions:
  actions: read
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: stock-picker-research
          run-id: 36842701260
          github-token: ${{ github.token }}
          path: .
      - run: python stock_picker_final_holdout_v1.py --pit output/sec_point_in_time_broad.json --out signals/stock_picker_final_holdout_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-picker-final-holdout
          path: signals/stock_picker_final_holdout_v1.json
