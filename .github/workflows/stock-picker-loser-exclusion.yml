name: Warman Stock Picker Loser Exclusion
on:
  workflow_dispatch:
  push:
    paths:
      - 'stock_picker_loser_exclusion_v1.py'
      - '.github/workflows/stock-picker-loser-exclusion.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: stock-picker-research
          run-id: 36842701260
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - run: python stock_picker_loser_exclusion_v1.py --pit output/sec_point_in_time_broad.json --out stock_picker_loser_exclusion_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-picker-loser-exclusion
          path: stock_picker_loser_exclusion_v1.json
