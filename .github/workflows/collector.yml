name: Warman Quant Collector and Paperdesk
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * 1-5'
permissions:
  contents: read
concurrency:
  group: paperdesk-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore previous paper journal
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: paperdesk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paperdesk-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline paperdesk regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect market data
        run: python collector.py
      - name: Validate market data
        run: python validate.py output
      - name: Run research-only paperdesk
        run: python paperdesk.py --folder output --state state/paperdesk.json
      - name: Run exploratory research lab
        run: python research.py --folder output
      - name: Run cash-backed crypto portfolio research
        run: python portfolio_v6.py --folder output
      - name: Persist journal
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: paperdesk-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload audit and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Warman-Quant-Data
          path: |
            output/
            state/
          retention-days: 90
