name: Warman Quant Collector and Paperdesk
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: paperdesk-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline paperdesk regression tests
        run: python -m unittest discover -s tests -v
      - name: Syntax-check collector
        run: python -m py_compile collector.py
      - name: Collect market data
        run: python collector.py
      - name: Validate market data
        run: python validate.py output
      - name: Audit journal continuity (fail closed; no silent paper bootstrap)
        run: python audit_journal.py --state state/paperdesk.json --ledger state/ledger.json --report output/journal_audit.json
      - name: Run exploratory research lab
        run: python research.py --folder output
      - name: Run Flow Dislocation daily research\n        run: python flow_dislocation.py --folder output\n      - name: Run cash-backed crypto portfolio research (diagnostic only)
        run: python portfolio_v6.py --folder output
      - name: Enforce Nordnet instrument promotion gate
        run: python promotion_gate.py --folder output
      - name: Publish research summaries to repository\n        if: success()\n        run: |\n          mkdir -p reports\n          cp output/flow_dislocation_report.json output/flow_dislocation_summary.csv reports/\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add reports/flow_dislocation_report.json reports/flow_dislocation_summary.csv\n          if ! git diff --cached --quiet; then\n            git commit -m 'Update Flow Dislocation research results [skip ci]'\n            git push origin HEAD:main\n          fi\n      - name: Upload audit and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Warman-Quant-Data
          path: |
            output/
            state/
          retention-days: 90
